[package]
name = "belajar-rust-axum"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
dotenv = "0.15.0"
serde = {version = "1.0.228", features = ["derive"]}
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "macros"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
